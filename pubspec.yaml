name: hrtz_hrms
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  audioplayers: ^6.5.1
  cached_network_image: ^3.4.1
  change_app_package_name: ^1.5.0
  crypto: ^3.0.6
  dia: ^0.1.5
  dio: ^5.9.0
  file_picker: ^10.3.3
  firebase_core: ^4.2.0
  firebase_crashlytics: ^5.0.2
  firebase_messaging: ^16.0.3
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_initicon: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^19.5.0
  flutter_native_splash: ^2.4.7
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.4
  http: ^1.5.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  logger: ^2.6.2
  mime: ^2.0.0
  open_file: ^3.5.10
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  pinput: ^5.0.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  socket_io_client: ^3.1.2
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  video_player: ^2.10.0
  syncfusion_flutter_charts: ^31.2.4

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.jpg
  android: true
  ios: true
  android_gravity: center
  fullscreen: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"
  adaptive_icon_foreground_inset: 24



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/splash.mp4
    - keys.env